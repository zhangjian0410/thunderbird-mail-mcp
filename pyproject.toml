[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderbird-mail-mcp"
version = "0.5.0"
description = "Thunderbird local mail queries and explicitly delegated native sending"
requires-python = ">=3.10"
dependencies = ["mcp>=1,<2"]

[tool.setuptools]
py-modules = ["mail_store", "mail_reader", "mail_composer", "mail_sender", "native_host", "server"]
